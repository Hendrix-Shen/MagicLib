name: _step.checkstyle
on:
  workflow_call:
    inputs:
      build_version_type:
        type: string
        default: 'DEV'
        required: false
jobs:
  checkstyle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Cache gradle files
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/*.accesswidener', 'settings.json') }}
      # TODO: Remove in next major version
      - name: Preprocess Resources
        run: |
          chmod +x gradlew
          ./gradlew preprocessResources
        env:
          BUILD_TYPE: ${{ inputs.build_version_type }}
      - name: Checkstyle with gradle
        run: |
          ./gradlew checkstyleMain -x test --stacktrace
        env:
          BUILD_TYPE: ${{ inputs.build_version_type }}
      - name: Publish Checkstyle report
        uses: Juuxel/publish-checkstyle-report@v2
        if: ${{ failure() }}
        with:
          reports: |
            */**/build/reports/checkstyle/*.xml
